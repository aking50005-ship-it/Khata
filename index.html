<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khata</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
header{background:#1769aa;color:white;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.container{padding:15px}
.card{background:white;padding:18px;margin:10px 0;border-radius:12px;box-shadow:0 2px 8px #ccc}
button{border:0;border-radius:8px;padding:12px 18px;margin:5px;background:#1769aa;color:white;font-size:16px}
input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.green{background:#16803c}.red{background:#c62828}
.customer{padding:12px;border-bottom:1px solid #ddd}
.hidden{display:none}
.amount{font-size:22px;font-weight:bold}
</style>
</head>
<body>

<header>📒 Khata</header>

<div class="container">

<div id="home">
<div class="card">
<h3>Total Jama</h3>
<div class="amount" id="totalJama">Rs 0</div>
</div>

<div class="card">
<h3>Total Udhaar</h3>
<div class="amount" id="totalUdhaar">Rs 0</div>
</div>

<div class="card">
<button onclick="showAdd()">+ Add Customer</button>
</div>

<div class="card">
<h3>Customers</h3>
<div id="customers">Koi customer nahi</div>
</div>
</div>

<div id="add" class="hidden">
<div class="card">
<h2>Add Customer</h2>
<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone Number">
<button onclick="addCustomer()">Save Customer</button>
<button onclick="home()">Back</button>
</div>
</div>

<div id="khata" class="hidden">
<div class="card">
<h2 id="customerName"></h2>
<p>Phone: <span id="customerPhone"></span></p>
<p>Jama: <b id="jama">Rs 0</b></p>
<p>Udhaar: <b id="udhaar">Rs 0</b></p>
<p>Balance: <b id="balance">Rs 0</b></p>

<input id="amount" type="number" placeholder="Amount">

<button class="green" onclick="jamaAdd()">+ Jama</button>
<button class="red" onclick="udhaarAdd()">+ Udhaar</button>
<button onclick="home()">Back</button>
</div>

<div class="card">
<h3>Transaction History</h3>
<div id="history">No transactions</div>
</div>
</div>

</div>

<script>
let data=JSON.parse(localStorage.getItem("khataData")||"[]");
let current=null;

function save(){localStorage.setItem("khataData",JSON.stringify(data));}

function home(){
document.getElementById("home").classList.remove("hidden");
document.getElementById("add").classList.add("hidden");
document.getElementById("khata").classList.add("hidden");
render();
}

function showAdd(){
document.getElementById("home").classList.add("hidden");
document.getElementById("add").classList.remove("hidden");
}

function addCustomer(){
let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();

if(!name){alert("Customer ka naam likhein");return;}

data.push({name:name,phone:phone,jama:0,udhaar:0,history:[]});
save();

document.getElementById("name").value="";
document.getElementById("phone").value="";

home();
}

function openCustomer(i){
current=i;
let c=data[i];

document.getElementById("home").classList.add("hidden");
document.getElementById("add").classList.add("hidden");
document.getElementById("khata").classList.remove("hidden");

document.getElementById("customerName").innerText=c.name;
document.getElementById("customerPhone").innerText=c.phone||"-";

showKhata();
}

function showKhata(){
let c=data[current];

document.getElementById("jama").innerText="Rs "+c.jama;
document.getElementById("udhaar").innerText="Rs "+c.udhaar;
document.getElementById("balance").innerText="Rs "+(c.jama-c.udhaar);

let h=document.getElementById("history");
h.innerHTML="";

if(c.history.length===0){
h.innerText="No transactions";
return;
}

c.history.slice().reverse().forEach(x=>{
let d=document.createElement("div");
d.className="customer";
d.innerText=x.type+" : Rs "+x.amount+" ("+x.date+")";
h.appendChild(d);
});
}

function jamaAdd(){
let a=Number(document.getElementById("amount").value);
if(!a||a<=0){alert("Amount likhein");return;}

let c=data[current];
c.jama+=a;
c.history.push({type:"Jama",amount:a,date:new Date().toLocaleString()});

document.getElementById("amount").value="";
save();
showKhata();
}

function udhaarAdd(){
let a=Number(document.getElementById("amount").value);
if(!a||a<=0){alert("Amount likhein");return;}

let c=data[current];
c.udhaar+=a;
c.history.push({type:"Udhaar",amount:a,date:new Date().toLocaleString()});

document.getElementById("amount").value="";
save();
showKhata();
}

function render(){
let box=document.getElementById("customers");
box.innerHTML="";

let tj=0,tu=0;

data.forEach((c,i)=>{
tj+=c.jama;
tu+=c.udhaar;

let d=document.createElement("div");
d.className="customer";
d.innerHTML="<b>"+c.name+"</b><br>Jama: Rs "+c.jama+" | Udhaar: Rs "+c.udhaar;
d.onclick=()=>openCustomer(i);
box.appendChild(d);
});

if(data.length===0)box.innerText="Koi customer nahi";

document.getElementById("totalJama").innerText="Rs "+tj;
document.getElementById("totalUdhaar").innerText="Rs "+tu;
}

render();
</script>

</body>
             </html>
